<!--
  Catfish-Pi application icon (original artwork, 2026-10): an amber catfish with
  swept barbels on a dark tile. This SVG is the source of truth for
  assets/icon.png, assets/icon.icns, and assets/icon.iconset/*; the transparent
  variant for in-app brand marks is assets/brand/catfish-mascot.svg
  (rendered to public/catfishpi-mascot.png and assets/brand/catfishpi-mascot.png).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a26"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="fish" x1="0.1" y1="0.2" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#tile)"/>
  <g>
    <!-- whiskers: long swept barbels, the catfish signature -->
    <g fill="none" stroke="url(#fish)" stroke-width="34" stroke-linecap="round">
      <path d="M 200 500 C 158 448, 120 420, 66 404"/>
      <path d="M 188 556 C 132 548, 88 558, 44 586"/>
      <path d="M 206 604 C 170 650, 128 678, 76 690"/>
    </g>
    <!-- body silhouette: broad flat head, long tapering body, forked tail -->
    <path fill="url(#fish)" d="
      M 182 552
      C 196 498, 236 458, 296 434
      C 360 408, 440 398, 520 402
      C 560 404, 596 408, 624 416
      C 634 420, 646 380, 660 342
      C 666 328, 678 328, 684 342
      C 694 372, 700 402, 706 428
      C 742 448, 774 472, 800 496
      C 814 506, 858 462, 902 432
      C 914 424, 924 432, 916 446
      C 900 478, 876 506, 854 522
      C 876 540, 900 572, 916 606
      C 924 620, 914 630, 900 620
      C 860 590, 818 560, 798 552
      C 736 598, 656 632, 572 650
      C 560 652, 552 678, 540 694
      C 532 704, 522 702, 520 690
      C 516 674, 518 660, 514 656
      C 424 672, 330 660, 268 630
      C 224 608, 194 584, 182 552
      Z"/>
    <!-- gill curve (tile-colored) -->
    <path fill="none" stroke="#0d1420" stroke-width="24" stroke-linecap="round" d="M 392 452 C 370 502, 370 560, 396 610"/>
    <!-- eye -->
    <circle cx="312" cy="488" r="34" fill="#0d1420"/>
  </g>
</svg>
